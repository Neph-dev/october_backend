name: Deploy Go backend to ECS Fargate

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: october-backend
  ECS_CLUSTER: october-cluster
  ECS_SERVICE: october-backend-service
  ECS_TASK_DEFINITION: aws/ecs-task-definition.json

jobs:
  deploy:
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Get AWS Account ID
        id: account-id
        run: echo "account-id=$(aws sts get-caller-identity --query 'Account' --output text)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          ACCOUNT_ID: ${{ steps.account-id.outputs.account-id }}
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          FULL_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          aws ecr describe-repositories --repository-names ${ECR_REPOSITORY} || \
            aws ecr create-repository --repository-name ${ECR_REPOSITORY}

          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          docker build -t ${FULL_IMAGE} .
          docker push ${FULL_IMAGE}

          echo "image=${FULL_IMAGE}" >> $GITHUB_OUTPUT

      - name: Ensure IAM execution role exists
        run: |
          ROLE_NAME="ecsTaskExecutionRole"
          POLICY_ARN="arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "Creating IAM role $ROLE_NAME"
            aws iam create-role \
              --role-name "$ROLE_NAME" \
              --assume-role-policy-document '{
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Principal": {"Service": "ecs-tasks.amazonaws.com"},
                    "Action": "sts:AssumeRole"
                  }
                ]
              }'
            aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn "$POLICY_ARN"
          else
            echo "IAM role $ROLE_NAME already exists"
          fi

      - name: Prepare ECS task definition
        env:
          ACCOUNT_ID: ${{ steps.account-id.outputs.account-id }}
        run: |
          IMAGE="${{ steps.build-and-push.outputs.image }}"
          jq \
            --arg img "$IMAGE" \
            --arg exec "arn:aws:iam::${ACCOUNT_ID}:role/ecsTaskExecutionRole" \
            --arg task "arn:aws:iam::${ACCOUNT_ID}:role/ecsTaskExecutionRole" \
            '.containerDefinitions[0].image=$img | .executionRoleArn=$exec | .taskRoleArn=$task' \
            ${{ env.ECS_TASK_DEFINITION }} > /tmp/ecs-task-def.json
          mv /tmp/ecs-task-def.json ${{ env.ECS_TASK_DEFINITION }}

      - name: Register ECS task definition
        id: register
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ env.ECS_TASK_DEFINITION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task-def-arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "Registered task definition: $TASK_DEF_ARN"

      - name: Get VPC and Subnet IDs
        id: network
        run: |
          echo "Fetching default VPC and public subnets..."
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=is-default,Values=true" \
            --query 'Vpcs[0].VpcId' \
            --output text)

          # Get only subnets where map-public-ip-on-launch=true (public subnets)
          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=map-public-ip-on-launch,Values=true" \
            --query 'Subnets[*].SubnetId' \
            --output text | tr ' ' ',')

          echo "vpc-id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "subnet-ids=$SUBNET_IDS" >> $GITHUB_OUTPUT

          echo "VPC: $VPC_ID"
          echo "Subnets: $SUBNET_IDS"


      - name: Setup networking and load balancer
        id: alb
        env:
          VPC_ID: ${{ steps.network.outputs.vpc-id }}
          SUBNET_IDS: ${{ steps.network.outputs.subnet-ids }}
        run: |
          # Create ALB SG (open 80/443)
          ALB_SG=$(aws ec2 create-security-group \
            --group-name october-alb-sg \
            --description "ALB SG" \
            --vpc-id $VPC_ID \
            --query 'GroupId' --output text 2>/dev/null || \
            aws ec2 describe-security-groups --filters Name=group-name,Values=october-alb-sg --query 'SecurityGroups[0].GroupId' --output text)
          aws ec2 authorize-security-group-ingress --group-id $ALB_SG --protocol tcp --port 80 --cidr 0.0.0.0/0 || true
          aws ec2 authorize-security-group-ingress --group-id $ALB_SG --protocol tcp --port 443 --cidr 0.0.0.0/0 || true

          # Create Task SG (allow ALB only)
          TASK_SG=$(aws ec2 create-security-group \
            --group-name october-tasks-sg \
            --description "Tasks SG" \
            --vpc-id $VPC_ID \
            --query 'GroupId' --output text 2>/dev/null || \
            aws ec2 describe-security-groups --filters Name=group-name,Values=october-tasks-sg --query 'SecurityGroups[0].GroupId' --output text)
          aws ec2 authorize-security-group-ingress --group-id $TASK_SG --protocol tcp --port 8080 --source-group $ALB_SG || true
          aws ec2 authorize-security-group-egress --group-id $TASK_SG --protocol -1 --cidr 0.0.0.0/0 || true

          # Create ALB
          SUBNET_ARG=$(echo $SUBNET_IDS | sed 's/,/ /g')
          ALB_ARN=$(aws elbv2 create-load-balancer \
            --name october-alb \
            --subnets $SUBNET_ARG \
            --security-groups $ALB_SG \
            --scheme internet-facing \
            --type application \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || \
            aws elbv2 describe-load-balancers --names october-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          ALB_DNS=$(aws elbv2 describe-load-balancers --load-balancer-arns $ALB_ARN --query 'LoadBalancers[0].DNSName' --output text)

          # Create Target Group
          TG_ARN=$(aws elbv2 create-target-group \
            --name october-backend-tg \
            --protocol HTTP \
            --port 8080 \
            --vpc-id $VPC_ID \
            --target-type ip \
            --health-check-path "/health" \
            --health-check-protocol HTTP \
            --health-check-interval-seconds 15 \
            --matcher HttpCode=200 \
            --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || \
            aws elbv2 describe-target-groups --names october-backend-tg --query 'TargetGroups[0].TargetGroupArn' --output text)

          # Create Listener
          aws elbv2 create-listener \
            --load-balancer-arn $ALB_ARN \
            --protocol HTTP \
            --port 80 \
            --default-actions Type=forward,TargetGroupArn=$TG_ARN >/dev/null 2>&1 || true

          echo "alb-sg=$ALB_SG" >> $GITHUB_OUTPUT
          echo "task-sg=$TASK_SG" >> $GITHUB_OUTPUT
          echo "tg-arn=$TG_ARN" >> $GITHUB_OUTPUT
          echo "alb-dns=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "ALB DNS: $ALB_DNS"

      - name: Create or update ECS service
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.task-def-arn }}
          TG_ARN: ${{ steps.alb.outputs.tg-arn }}
          TASK_SG: ${{ steps.alb.outputs.task-sg }}
          VPC_ID: ${{ steps.network.outputs.vpc-id }}
          SUBNET_IDS: ${{ steps.network.outputs.subnet-ids }}
        run: |
          CLUSTER=${ECS_CLUSTER}
          SERVICE=${ECS_SERVICE}
          SUBNET_ARG=$(echo $SUBNET_IDS | sed 's/,/ /g')
          if aws ecs describe-services --cluster $CLUSTER --services $SERVICE --query 'services[0].status' --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "Updating existing ECS service..."
            aws ecs update-service \
              --cluster $CLUSTER \
              --service $SERVICE \
              --task-definition $TASK_DEF_ARN \
              --force-new-deployment
          else
            echo "Creating new ECS service..."
            aws ecs create-service \
              --cluster $CLUSTER \
              --service-name $SERVICE \
              --task-definition $TASK_DEF_ARN \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$TASK_SG],assignPublicIp=DISABLED}" \
              --load-balancers "targetGroupArn=$TG_ARN,containerName=october-backend,containerPort=8080" \
              --enable-execute-command \
              --deployment-configuration "maximumPercent=200,minimumHealthyPercent=50"
          fi

      - name: Output ALB DNS
        run: echo "Backend URL; http://${{ steps.alb.outputs.alb-dns }}/health"
  