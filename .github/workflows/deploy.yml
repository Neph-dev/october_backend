name: Deploy Go backend to ECS Fargate

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: october-backend
  ECS_CLUSTER: october-cluster
  ECS_SERVICE: october-backend-service
  ECS_TASK_DEFINITION: aws/ecs-task-definition.json
  CUSTOM_DOMAIN: ${{ secrets.OCTOBER_CUSTOM_DOMAIN }}
  HOSTED_ZONE_NAME: ${{ secrets.HOSTED_ZONE_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Get AWS Account ID
        id: account-id
        run: echo "account-id=$(aws sts get-caller-identity --query 'Account' --output text)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build-image
        env:
          ACCOUNT_ID: ${{ steps.account-id.outputs.account-id }}
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          FULL_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          aws ecr describe-repositories --repository-names ${ECR_REPOSITORY} || \
            aws ecr create-repository --repository-name ${ECR_REPOSITORY}

          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          docker build -t ${FULL_IMAGE} .
          docker push ${FULL_IMAGE}

          echo "image=${FULL_IMAGE}" >> $GITHUB_OUTPUT

      - name: Ensure IAM execution role exists
        env:
          ACCOUNT_ID: ${{ steps.account-id.outputs.account-id }}
        run: |
          ROLE_NAME="ecsTaskExecutionRole"
          POLICY_ARN="arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "Creating IAM role $ROLE_NAME"
            aws iam create-role \
              --role-name "$ROLE_NAME" \
              --assume-role-policy-document '{
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Principal": {"Service": "ecs-tasks.amazonaws.com"},
                    "Action": "sts:AssumeRole"
                  }
                ]
              }'
            aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn "$POLICY_ARN"
          else
            echo "IAM role $ROLE_NAME already exists"
          fi

          # Create CloudWatch log group
          LOG_GROUP_NAME="/ecs/october-backend"
          if ! aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP_NAME" --query 'logGroups[?logGroupName==`'$LOG_GROUP_NAME'`]' --output text | grep -q "$LOG_GROUP_NAME"; then
            echo "Creating CloudWatch log group: $LOG_GROUP_NAME"
            aws logs create-log-group --log-group-name "$LOG_GROUP_NAME"
            aws logs put-retention-policy --log-group-name "$LOG_GROUP_NAME" --retention-in-days 30
            echo "✅ CloudWatch log group created"
          else
            echo "✅ CloudWatch log group already exists"
          fi

          # Ensure the execution role can read SSM Parameter Store values under /october/* and decrypt if SecureString
          POLICY_JSON=$(jq -n --arg region "$AWS_REGION" --arg account "$ACCOUNT_ID" '
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "ssm:GetParameter",
                    "ssm:GetParameters",
                    "ssm:GetParametersByPath"
                  ],
                  "Resource": [
                    ("arn:aws:ssm:" + $region + ":" + $account + ":parameter/october"),
                    ("arn:aws:ssm:" + $region + ":" + $account + ":parameter/october/*")
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "kms:Decrypt",
                    "logs:CreateLogGroup",
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": "*",
                }
              ]
            }
          ')

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name ecsTaskExecutionRoleParameterRead \
            --policy-document "$POLICY_JSON"

      - name: Prepare ECS task definition
        env:
          ACCOUNT_ID: ${{ steps.account-id.outputs.account-id }}
        run: |
          IMAGE="${{ steps.build-image.outputs.image }}"
          jq \
            --arg img "$IMAGE" \
            --arg exec "arn:aws:iam::${ACCOUNT_ID}:role/ecsTaskExecutionRole" \
            --arg task "arn:aws:iam::${ACCOUNT_ID}:role/ecsTaskExecutionRole" \
            '.containerDefinitions[0].image=$img | .executionRoleArn=$exec | .taskRoleArn=$task' \
            ${{ env.ECS_TASK_DEFINITION }} > /tmp/ecs-task-def.json
          mv /tmp/ecs-task-def.json ${{ env.ECS_TASK_DEFINITION }}

      - name: Register ECS task definition
        id: register
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ env.ECS_TASK_DEFINITION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task-def-arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "Registered task definition: $TASK_DEF_ARN"

      - name: Get VPC and Subnet IDs
        id: network
        run: |
          echo "Fetching default VPC and public subnets..."
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=is-default,Values=true" \
            --query 'Vpcs[0].VpcId' \
            --output text)

          # Get only subnets where map-public-ip-on-launch=true (public subnets)
          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=map-public-ip-on-launch,Values=true" \
            --query 'Subnets[].SubnetId' \
            --output json | jq -r 'join(",")')

          echo "vpc-id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "subnet-ids=$SUBNET_IDS" >> $GITHUB_OUTPUT

          echo "VPC: $VPC_ID"
          echo "Subnets: $SUBNET_IDS"


      - name: Setup networking and load balancer
        id: alb
        env:
          VPC_ID: ${{ steps.network.outputs.vpc-id }}
          SUBNET_IDS: ${{ steps.network.outputs.subnet-ids }}
        run: |
          # Create/reuse ALB security group (open 80/443)
          ALB_SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=october-alb-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null)

          if [ -z "$ALB_SG" ] || [ "$ALB_SG" = "None" ]; then
            ALB_SG=$(aws ec2 create-security-group \
              --group-name october-alb-sg \
              --description "ALB SG" \
              --vpc-id $VPC_ID \
              --query 'GroupId' --output text)
            echo "Created ALB security group: $ALB_SG"
          else
            echo "Reusing ALB security group: $ALB_SG"
          fi

          # Ensure ALB ingress rules exist (tolerate duplicates without failing the step)
          set +e
          OUT=$(aws ec2 authorize-security-group-ingress --group-id $ALB_SG --protocol tcp --port 80 --cidr 0.0.0.0/0 2>&1)
          if echo "$OUT" | grep -q "InvalidPermission.Duplicate"; then
            echo "ALB ingress rule for port 80 already present"
          elif [ -n "$OUT" ]; then
            echo "$OUT"
            # continue even if another benign error occurred
          else
            echo "Added ALB ingress rule for port 80"
          fi

          OUT=$(aws ec2 authorize-security-group-ingress --group-id $ALB_SG --protocol tcp --port 443 --cidr 0.0.0.0/0 2>&1)
          if echo "$OUT" | grep -q "InvalidPermission.Duplicate"; then
            echo "ALB ingress rule for port 443 already present"
          elif [ -n "$OUT" ]; then
            echo "$OUT"
          else
            echo "Added ALB ingress rule for port 443"
          fi
          set -e

          # Create/reuse task security group (allow traffic from ALB)
          TASK_SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=october-tasks-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null)

          if [ -z "$TASK_SG" ] || [ "$TASK_SG" = "None" ]; then
            TASK_SG=$(aws ec2 create-security-group \
              --group-name october-tasks-sg \
              --description "Tasks SG" \
              --vpc-id $VPC_ID \
              --query 'GroupId' --output text)
            echo "Created task security group: $TASK_SG"
          else
            echo "Reusing task security group: $TASK_SG"
          fi

          # Ensure task security group ingress and egress rules exist (tolerate duplicates)
          set +e
          OUT=$(aws ec2 authorize-security-group-ingress --group-id $TASK_SG --protocol tcp --port 8080 --source-group $ALB_SG 2>&1)
          if echo "$OUT" | grep -q "InvalidPermission.Duplicate"; then
            echo "Task security group already allows traffic from ALB"
          elif [ -n "$OUT" ]; then
            echo "$OUT"
          else
            echo "Added task security group ingress rule"
          fi

          OUT=$(aws ec2 authorize-security-group-egress --group-id $TASK_SG --protocol -1 --cidr 0.0.0.0/0 2>&1)
          if echo "$OUT" | grep -q "InvalidPermission.Duplicate"; then
            echo "Task security group egress already open"
          elif [ -n "$OUT" ]; then
            echo "$OUT"
          else
            echo "Added task security group egress rule"
          fi
          set -e

          # Create or reuse ALB
          SUBNET_ARG=$(echo "$SUBNET_IDS" | sed 's/,/ /g')
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names october-alb \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text 2>/dev/null || true)

          if [ -z "$ALB_ARN" ] || [ "$ALB_ARN" = "None" ]; then
            ALB_ARN=$(aws elbv2 create-load-balancer \
              --name october-alb \
              --subnets $SUBNET_ARG \
              --security-groups $ALB_SG \
              --scheme internet-facing \
              --type application \
              --query 'LoadBalancers[0].LoadBalancerArn' --output text)
            echo "Created load balancer: $ALB_ARN"
          else
            echo "Reusing existing load balancer: $ALB_ARN"
          fi

          echo "Waiting for load balancer to become active..."
          aws elbv2 wait load-balancer-available --load-balancer-arns "$ALB_ARN"

          ALB_DNS=$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --query 'LoadBalancers[0].DNSName' --output text)

          # Create or reuse Target Group
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names october-backend-tg \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text 2>/dev/null || true)

          if [ -z "$TG_ARN" ] || [ "$TG_ARN" = "None" ]; then
            TG_ARN=$(aws elbv2 create-target-group \
              --name october-backend-tg \
              --protocol HTTP \
              --port 8080 \
              --vpc-id $VPC_ID \
              --target-type ip \
              --health-check-path "/health" \
              --health-check-protocol HTTP \
              --health-check-interval-seconds 15 \
              --matcher HttpCode=200 \
              --query 'TargetGroups[0].TargetGroupArn' --output text)
            echo "Created target group: $TG_ARN"
          else
            echo "Reusing target group: $TG_ARN"
          fi

          # Create Listener
          aws elbv2 create-listener \
            --load-balancer-arn $ALB_ARN \
            --protocol HTTP \
            --port 80 \
            --default-actions Type=forward,TargetGroupArn=$TG_ARN >/dev/null 2>&1 || true

          echo "alb-sg=$ALB_SG" >> $GITHUB_OUTPUT
          echo "task-sg=$TASK_SG" >> $GITHUB_OUTPUT
          echo "tg-arn=$TG_ARN" >> $GITHUB_OUTPUT
          echo "alb-dns=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "ALB DNS: $ALB_DNS"

      - name: Ensure ECS cluster exists
        run: |
          CLUSTER=${ECS_CLUSTER}
          STATUS=$(aws ecs describe-clusters --clusters "$CLUSTER" --query 'clusters[0].status' --output text 2>/dev/null || true)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "Creating ECS cluster $CLUSTER"
            aws ecs create-cluster --cluster-name "$CLUSTER" >/dev/null
          else
            echo "ECS cluster $CLUSTER already exists"
          fi

      - name: Ensure ECS service-linked role exists
        run: |
          ROLE_NAME="AWSServiceRoleForECS"
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "Creating ECS service-linked role: $ROLE_NAME"
            aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com >/dev/null 2>&1 || true
            # Wait briefly for IAM role propagation
            for i in {1..10}; do
              if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
                echo "Service-linked role is now available."
                break
              fi
              echo "Waiting for service-linked role propagation... ($i)"
              sleep 3
            done
          else
            echo "ECS service-linked role $ROLE_NAME already exists"
          fi

      - name: Create or update ECS service
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.task-def-arn }}
          TG_ARN: ${{ steps.alb.outputs.tg-arn }}
          TASK_SG: ${{ steps.alb.outputs.task-sg }}
          VPC_ID: ${{ steps.network.outputs.vpc-id }}
          SUBNET_IDS: ${{ steps.network.outputs.subnet-ids }}
        run: |
          CLUSTER=${ECS_CLUSTER}
          SERVICE=${ECS_SERVICE}
          # Guard: ensure we discovered at least one subnet ID
          if [ -z "$SUBNET_IDS" ] || [ "$SUBNET_IDS" = "None" ]; then
            echo "ERROR: No public subnets found (map-public-ip-on-launch=true) in VPC $VPC_ID. Cannot create ECS service."
            exit 1
          fi

          # Build a proper JSON network configuration to avoid CLI shorthand parsing issues
          # Convert comma-separated subnet IDs -> JSON array ["subnet-1","subnet-2",...]
          SUBNETS_JSON=$(printf "%s" "$SUBNET_IDS" | tr ',[:space:]' '\n' | sed '/^$/d' | jq -R . | jq -s .)
          NETWORK_JSON=$(jq -n --argjson subnets "$SUBNETS_JSON" --arg sg "$TASK_SG" '{awsvpcConfiguration:{subnets:$subnets,securityGroups:[$sg],assignPublicIp:"ENABLED"}}')
          echo "Using network configuration: $NETWORK_JSON"

          if aws ecs describe-services --cluster $CLUSTER --services $SERVICE --query 'services[0].status' --output text 2>/dev/null | grep -q "ACTIVE"; then
            echo "Updating existing ECS service..."
            aws ecs update-service \
              --cluster $CLUSTER \
              --service $SERVICE \
              --task-definition $TASK_DEF_ARN \
              --force-new-deployment
          else
            echo "Creating new ECS service..."
            aws ecs create-service \
              --cluster $CLUSTER \
              --service-name $SERVICE \
              --task-definition $TASK_DEF_ARN \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "$NETWORK_JSON" \
              --load-balancers "targetGroupArn=$TG_ARN,containerName=october-backend,containerPort=8080" \
              --enable-execute-command \
              --deployment-configuration "maximumPercent=200,minimumHealthyPercent=50"
          fi

      - name: Output ALB DNS
        run: echo "Backend URL; http://${{ steps.alb.outputs.alb-dns }}/health"

  domain:
    name: Configure custom domain (Route53 + ACM + HTTPS)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Resolve ALB info
        id: alb
        run: |
          set -e
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names october-alb \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text)
          ALB_DNS=$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --query 'LoadBalancers[0].DNSName' --output text)
          ALB_ZONE_ID=$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --query 'LoadBalancers[0].CanonicalHostedZoneId' --output text)
          TG_ARN=$(aws elbv2 describe-target-groups --names october-backend-tg --query 'TargetGroups[0].TargetGroupArn' --output text)

          echo "alb-arn=$ALB_ARN" >> $GITHUB_OUTPUT
          echo "alb-dns=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "alb-zone-id=$ALB_ZONE_ID" >> $GITHUB_OUTPUT
          echo "tg-arn=$TG_ARN" >> $GITHUB_OUTPUT
          echo "ALB: $ALB_ARN | DNS: $ALB_DNS | ZoneId: $ALB_ZONE_ID | TG: $TG_ARN"

      - name: Ensure Route53 hosted zone exists
        id: zone
        run: |
          set -e
          HOSTED_ZONE_NAME=${HOSTED_ZONE_NAME%\.}
          ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name "$HOSTED_ZONE_NAME" --query 'HostedZones[0].Id' --output text)
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "None" ]; then
            echo "Hosted zone $HOSTED_ZONE_NAME not found in Route53."
            echo "If your DNS is external, create the CNAME/ALIAS there to point $CUSTOM_DOMAIN to ${{ steps.alb.outputs.alb-dns }}."
            exit 1
          fi
          ZONE_ID=${ZONE_ID#/hostedzone/}
          echo "zone-id=$ZONE_ID" >> $GITHUB_OUTPUT
          echo "Using hosted zone: $HOSTED_ZONE_NAME ($ZONE_ID)"

      - name: Ensure ACM certificate for custom domain
        id: cert
        run: |
          set -e
          DOMAIN="$CUSTOM_DOMAIN"
          CERT_ARN=$(aws acm list-certificates --certificate-statuses ISSUED PENDING_VALIDATION INACTIVE \
            --query "CertificateSummaryList[?DomainName=='${DOMAIN}'].CertificateArn | [0]" --output text)
          if [ -z "$CERT_ARN" ] || [ "$CERT_ARN" = "None" ]; then
            echo "Requesting new ACM certificate for $DOMAIN"
            CERT_ARN=$(aws acm request-certificate --domain-name "$DOMAIN" --validation-method DNS --query 'CertificateArn' --output text)
          else
            echo "Reusing certificate: $CERT_ARN"
          fi

          # Create/ensure DNS validation record
          RR_NAME=$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Name' --output text)
          RR_TYPE=$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Type' --output text)
          RR_VALUE=$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Value' --output text)

          CHANGE_BATCH=$(jq -n --arg name "$RR_NAME" --arg type "$RR_TYPE" --arg value "$RR_VALUE" '{
            Comment: "ACM DNS validation record",
            Changes: [
              {Action:"UPSERT", ResourceRecordSet:{Name:$name, Type:$type, TTL:300, ResourceRecords:[{Value:$value}]}}
            ]
          }')
          aws route53 change-resource-record-sets --hosted-zone-id ${{ steps.zone.outputs.zone-id }} --change-batch "$CHANGE_BATCH" >/dev/null
          echo "Created/updated validation record $RR_NAME"

          # Wait for certificate issuance (best-effort loop)
          echo "Waiting for ACM certificate to be ISSUED..."
          for i in {1..20}; do
            STATUS=$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --query 'Certificate.Status' --output text)
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "ISSUED" ]; then
              break
            fi
            sleep 30
          done

          FINAL_STATUS=$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --query 'Certificate.Status' --output text)
          if [ "$FINAL_STATUS" != "ISSUED" ]; then
            echo "Warning: Certificate not yet ISSUED (status=$FINAL_STATUS). Continuing to set up HTTPS listener; ALB may not serve HTTPS until issued."
          fi
          echo "cert-arn=$CERT_ARN" >> $GITHUB_OUTPUT

      - name: Ensure HTTPS listener on ALB
        run: |
          set -e
          ALB_ARN="${{ steps.alb.outputs.alb-arn }}"
          TG_ARN="${{ steps.alb.outputs.tg-arn }}"
          CERT_ARN="${{ steps.cert.outputs.cert-arn }}"
          # Check if listener on 443 exists
          EXISTING=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --query "Listeners[?Port==\`443\`].ListenerArn" --output text 2>/dev/null || true)
          if [ -z "$EXISTING" ] || [ "$EXISTING" = "None" ]; then
            echo "Creating HTTPS listener on 443"
            aws elbv2 create-listener \
              --load-balancer-arn "$ALB_ARN" \
              --protocol HTTPS \
              --port 443 \
              --certificates CertificateArn="$CERT_ARN" \
              --default-actions Type=forward,TargetGroupArn="$TG_ARN"
          else
            echo "HTTPS listener already exists: $EXISTING"
          fi

      - name: Create/Update Route53 ALIAS record for custom domain
        run: |
          set -e
          HOSTED_ZONE_ID="${{ steps.zone.outputs.zone-id }}"
          ALB_DNS="${{ steps.alb.outputs.alb-dns }}"
          ALB_ZONE_ID="${{ steps.alb.outputs.alb-zone-id }}"
          NAME="$CUSTOM_DOMAIN"
          CHANGE_BATCH=$(jq -n --arg name "$NAME" --arg albDns "$ALB_DNS" --arg albZone "$ALB_ZONE_ID" '{
            Comment: "Point custom domain to ALB",
            Changes: [
              {Action:"UPSERT", ResourceRecordSet:{Name:$name, Type:"A", AliasTarget:{HostedZoneId:$albZone, DNSName:$albDns, EvaluateTargetHealth:false}}}
            ]
          }')
          aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch "$CHANGE_BATCH"
          echo "✅ Created/updated alias: $NAME -> $ALB_DNS"
  