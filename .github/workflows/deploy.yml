name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: october-backend
  ECS_SERVICE: october-backend-service
  ECS_CLUSTER: october-cluster
  ECS_TASK_DEFINITION: aws/ecs-task-definition.json

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Get AWS Account ID
      id: account-id
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

    - name: Replace Account ID in task definition
      run: |
        sed -i 's/YOUR_ACCOUNT_ID/${{ steps.account-id.outputs.account-id }}/g' ${{ env.ECS_TASK_DEFINITION }}
        
        # Fix the task role ARN to use the execution role (since we don't have a separate task role)
        sed -i 's/"taskRoleArn": "arn:aws:iam::${{ steps.account-id.outputs.account-id }}:role\/ecsTaskRole"/"taskRoleArn": "arn:aws:iam::${{ steps.account-id.outputs.account-id }}:role\/ecsTaskExecutionRole-october"/g' ${{ env.ECS_TASK_DEFINITION }}
        
        # Update execution role name
        sed -i 's/ecsTaskExecutionRole"/ecsTaskExecutionRole-october"/g' ${{ env.ECS_TASK_DEFINITION }}

    - name: Create AWS infrastructure if it doesn't exist
      run: |
        echo "🚀 Setting up AWS infrastructure..."
        
        # 1. Create ECR repository if it doesn't exist
        if ! aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
          echo "Creating ECR repository: ${{ env.ECR_REPOSITORY }}"
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256
          
          # Set lifecycle policy
          cat > /tmp/lifecycle-policy.json << 'EOF'
        {
          "rules": [
            {
              "rulePriority": 1,
              "description": "Keep last 10 tagged images",
              "selection": {
                "tagStatus": "tagged",
                "tagPrefixList": ["v", "latest"],
                "countType": "imageCountMoreThan",
                "countNumber": 10
              },
              "action": {
                "type": "expire"
              }
            },
            {
              "rulePriority": 2,
              "description": "Keep last 5 commit-hash tagged images",
              "selection": {
                "tagStatus": "tagged",
                "countType": "imageCountMoreThan",
                "countNumber": 5
              },
              "action": {
                "type": "expire"
              }
            },
            {
              "rulePriority": 3,
              "description": "Delete untagged images older than 1 day",
              "selection": {
                "tagStatus": "untagged",
                "countType": "sinceImagePushed",
                "countUnit": "days",
                "countNumber": 1
              },
              "action": {
                "type": "expire"
              }
            }
          ]
        }
        EOF
          
          aws ecr put-lifecycle-policy \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --lifecycle-policy-text file:///tmp/lifecycle-policy.json
          
          echo "✅ ECR repository created successfully"
        else
          echo "✅ ECR repository already exists"
        fi
        
        # 2. Create ECS service-linked role if it doesn't exist
        echo "Checking ECS service-linked role..."
        if ! aws iam get-role --role-name AWSServiceRoleForECS > /dev/null 2>&1; then
          echo "Creating ECS service-linked role..."
          aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com || echo "Service-linked role might already exist or be in process"
          # Wait a moment for the role to be available
          sleep 10
        else
          echo "✅ ECS service-linked role already exists"
        fi
        
        # 3. Create ECS cluster if it doesn't exist
        if ! aws ecs describe-clusters --clusters ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }} --query 'clusters[0].status' --output text 2>/dev/null | grep -q "ACTIVE"; then
          echo "Creating ECS cluster: ${{ env.ECS_CLUSTER }}"
          aws ecs create-cluster \
            --cluster-name ${{ env.ECS_CLUSTER }} \
            --region ${{ env.AWS_REGION }} \
            --capacity-providers FARGATE \
            --default-capacity-provider-strategy capacityProvider=FARGATE,weight=1
          echo "✅ ECS cluster created successfully"
        else
          echo "✅ ECS cluster already exists"
        fi
        
        # 4. Create CloudWatch log group
        LOG_GROUP_NAME="/ecs/october-backend"
        if ! aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP_NAME" --query 'logGroups[?logGroupName==`'$LOG_GROUP_NAME'`]' --output text | grep -q "$LOG_GROUP_NAME"; then
          echo "Creating CloudWatch log group: $LOG_GROUP_NAME"
          aws logs create-log-group --log-group-name "$LOG_GROUP_NAME"
          aws logs put-retention-policy --log-group-name "$LOG_GROUP_NAME" --retention-in-days 30
          echo "✅ CloudWatch log group created"
        else
          echo "✅ CloudWatch log group already exists"
        fi
        
        # 5. Create task execution role if it doesn't exist
        TASK_EXECUTION_ROLE_NAME="ecsTaskExecutionRole-october"
        if ! aws iam get-role --role-name "$TASK_EXECUTION_ROLE_NAME" > /dev/null 2>&1; then
          echo "Creating ECS task execution role: $TASK_EXECUTION_ROLE_NAME"
          
          # Create assume role policy
          cat > /tmp/assume-role-policy.json << 'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
        EOF

          aws iam create-role \
            --role-name "$TASK_EXECUTION_ROLE_NAME" \
            --assume-role-policy-document file:///tmp/assume-role-policy.json

          # Attach AWS managed policy
          aws iam attach-role-policy \
            --role-name "$TASK_EXECUTION_ROLE_NAME" \
            --policy-arn "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

          # Create custom policy for Systems Manager and CloudWatch access
          cat > /tmp/ssm-policy.json << 'EOF'
        {
            "Version": "2012-10-17",
            "Statement": [
                {
                    "Effect": "Allow",
                    "Action": [
                        "ssm:GetParameter",
                        "ssm:GetParameters",
                        "ssm:GetParametersByPath"
                    ],
                    "Resource": [
                        "arn:aws:ssm:*:*:parameter/october/*"
                    ]
                },
                {
                    "Effect": "Allow",
                    "Action": [
                        "logs:CreateLogGroup",
                        "logs:CreateLogStream",
                        "logs:PutLogEvents"
                    ],
                    "Resource": [
                        "arn:aws:logs:*:*:log-group:/ecs/october-backend*"
                    ]
                }
            ]
        }
        EOF

          aws iam put-role-policy \
            --role-name "$TASK_EXECUTION_ROLE_NAME" \
            --policy-name "SSMParameterAccess" \
            --policy-document file:///tmp/ssm-policy.json

          # Clean up temporary files
          rm /tmp/assume-role-policy.json /tmp/ssm-policy.json
          
          echo "✅ Task execution role created successfully"
        else
          echo "✅ Task execution role already exists"
        fi
        
        # 6. Create essential Systems Manager parameters if they don't exist
        echo "Setting up essential Systems Manager parameters..."
        
        # DATABASE_URI - required
        if ! aws ssm get-parameter --name "/october/DATABASE_URI" > /dev/null 2>&1; then
          echo "⚠️  DATABASE_URI parameter missing - creating placeholder"
          aws ssm put-parameter \
            --name "/october/DATABASE_URI" \
            --value "mongodb://placeholder-update-this-value" \
            --type "SecureString" \
            --description "MongoDB connection string for October Backend (UPDATE THIS VALUE)"
        fi
        
        # Optional parameters - create placeholders if they don't exist
        for param in "OPENAI_API_KEY" "CUSTOM_SEARCH_API_KEY" "CUSTOM_SEARCH_ENGINE_ID" "FINNHUB_API_KEY"; do
          if ! aws ssm get-parameter --name "/october/$param" > /dev/null 2>&1; then
            echo "Creating placeholder for optional parameter: $param"
            aws ssm put-parameter \
              --name "/october/$param" \
              --value "placeholder-update-if-needed" \
              --type "SecureString" \
              --description "Optional parameter for October Backend" || echo "Parameter might already exist"
          fi
        done

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and push it to ECR
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: october-backend
        image: ${{ steps.build-image.outputs.image }}

    - name: Register task definition and create/update service
      run: |
        echo "📋 Registering ECS task definition..."
        
        # Display task definition for debugging
        echo "🔍 Task definition contents:"
        cat ${{ steps.task-def.outputs.task-definition }} | jq .
        
        # Register the task definition
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://${{ steps.task-def.outputs.task-definition }} \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        
        echo "✅ Task definition registered: $TASK_DEF_ARN"
        
        # Get default VPC and subnets (needed for both create and update)
        VPC_ID=$(aws ec2 describe-vpcs --filters "Name=is-default,Values=true" --query 'Vpcs[0].VpcId' --output text)
        SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')
        
        echo "🌐 Using VPC: $VPC_ID"
        echo "🌐 Using subnets: $SUBNET_IDS"
        
        # Create security group if it doesn't exist
        SG_NAME="october-backend-sg"
        if ! aws ec2 describe-security-groups --group-names "$SG_NAME" > /dev/null 2>&1; then
          echo "🔒 Creating security group..."
          SG_ID=$(aws ec2 create-security-group \
            --group-name "$SG_NAME" \
            --description "Security group for October Backend" \
            --vpc-id "$VPC_ID" \
            --query 'GroupId' \
            --output text)
          
          # Allow inbound traffic on port 8080
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 8080 \
            --cidr 0.0.0.0/0
          
          # Allow all outbound traffic (needed for database connections, etc.)
          aws ec2 authorize-security-group-egress \
            --group-id "$SG_ID" \
            --protocol -1 \
            --cidr 0.0.0.0/0 || echo "Egress rule might already exist"
          
          echo "✅ Security group created: $SG_ID"
        else
          SG_ID=$(aws ec2 describe-security-groups --group-names "$SG_NAME" --query 'SecurityGroups[0].GroupId' --output text)
          echo "✅ Using existing security group: $SG_ID"
        fi
        
        # Check if service exists
        if aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} --query 'services[0].status' --output text 2>/dev/null | grep -q "ACTIVE"; then
          echo "📦 Updating existing ECS service..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition "$TASK_DEF_ARN" \
            --desired-count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SG_ID],assignPublicIp=ENABLED}"
        else
          echo "🆕 Creating new ECS service..."
          
          # Create the service
          aws ecs create-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --task-definition "$TASK_DEF_ARN" \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
            --enable-execute-command
        fi
        
        echo "⏳ Waiting for service to stabilize (timeout: 10 minutes)..."
        
        # Wait with timeout and better error handling
        if timeout 600 aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }}; then
          echo "✅ Service deployment completed successfully"
        else
          echo "❌ Service deployment timed out or failed"
          
          # Get service details for debugging
          echo "🔍 Service details:"
          aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }}
          
          # Get task details
          echo "🔍 Task details:"
          TASK_ARNS=$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --service-name ${{ env.ECS_SERVICE }} --query 'taskArns' --output text)
          if [ ! -z "$TASK_ARNS" ] && [ "$TASK_ARNS" != "None" ]; then
            aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ARNS
          else
            echo "No tasks found for service"
          fi
          
          # Get recent service events
          echo "🔍 Recent service events:"
          aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} --query 'services[0].events[:10]'
          
          exit 1
        fi

    - name: Post-deployment health check
      run: |
        echo "Waiting for service to stabilize..."
        sleep 60
        
        # Get the public IP of the service
        TASK_ARN=$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --service-name ${{ env.ECS_SERVICE }} --query "taskArns[0]" --output text)
        
        if [ "$TASK_ARN" != "None" ]; then
          PUBLIC_IP=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ARN --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text | xargs -I {} aws ec2 describe-network-interfaces --network-interface-ids {} --query "NetworkInterfaces[0].Association.PublicIp" --output text)
          
          if [ "$PUBLIC_IP" != "None" ]; then
            echo "Service endpoint: http://$PUBLIC_IP:8080"
            echo "Testing health endpoint..."
            
            # Retry health check up to 5 times
            for i in {1..5}; do
              if curl -f -s "http://$PUBLIC_IP:8080/health"; then
                echo "✅ Health check passed"
                break
              else
                echo "⏳ Health check attempt $i failed, retrying in 10 seconds..."
                sleep 10
              fi
            done
          fi
        fi

    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Deployment successful!"
        echo "The October Backend has been deployed to AWS ECS."